services:
  proxy-waf:
    image: owasp/modsecurity-crs:nginx
    environment:
      - BACKEND=http://legacy_app:8080
      - NGINX_X_FORWARDED_PORT=443
    ports:
      - target: 8080
        published: 80
        mode: host
      - target: 8443 # publico
        published: 443
        mode: host
      - target: 9443 # rede corporativa
        published: 9443
        mode: host
    volumes:
      - /opt/nginx/templates/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - /opt/nginx/certs:/etc/nginx/certs:ro
    networks:
      - legacy_net
    deploy:
      placement:
        constraints: [node.hostname == dmz]
      restart_policy:
        condition: any
        delay: 5s

  legacy_app:
    image: legacy_app:local
    # read_only: true
    environment:
      - DB_HOST=192.168.60.40
      - DB_PORT=5432
    networks:
      - legacy_net
    deploy:
      placement:
        constraints: [node.hostname == swarm-worker]
      restart_policy:
        condition: any
        delay: 5s

networks:
  legacy_net:
    driver: overlay
    driver_opts:
      encrypted: "true"
